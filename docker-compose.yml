version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_company_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/aicompany
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@db:5432/aicompany
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-key}
      - LLM_PROVIDER=gemini
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./workspace_repos:/app/workspace_repos

  db:
    image: pgvector/pgvector:pg16
    container_name: ai_company_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicompany
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicompany"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_company_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
